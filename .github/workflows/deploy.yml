name: AfriConnect Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter platforms
        run: flutter create . --platforms web,android,ios

      - name: Install dependencies
        run: flutter pub get

      - name: Build AfriConnect Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create . --platforms android

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: africonnect-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create iOS platform
        run: flutter create . --platforms ios

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: africonnect-ios-build-unsigned
          path: build/ios/iphoneos/Runner.app

  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publish AfriConnect
        uses: actions/deploy-pages@v4
